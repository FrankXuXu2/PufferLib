[base]
env_name = dogfight

[vec]
total_agents = 4096
num_buffers = 8
num_threads = 8

[policy]
num_layers = 2
hidden_size = 128

[env]
num_agents = 1
max_steps = 300
obs_scheme = 1
curriculum_enabled = 1
curriculum_randomize = 0
reward_aim_scale = 0.001695
reward_closing_scale = 0.0001
penalty_neg_g = 0.035
control_rate_penalty = 0.002
low_altitude_threshold = 1200.0
low_altitude_penalty = 0.005
speed_min = 50.0
aim_decay_stage = 30.0
shaping_decay_start = 100_000_000
shaping_decay_end = 150_000_000
energy_gain_scale = 0.001
energy_loss_scale = 0.0005
energy_advantage_scale = 0.004
eval_spawn_mode = 0
recovery_enabled = 1
recovery_altitude_threshold = 500.0
recovery_trigger_prob = 0.1
recovery_speed_threshold = 70.0
recovery_bank_deg = 60.0
domain_randomization = 0.0
vertical_spawn_prob = 0.1

[curriculum]
enabled = 1
initial_target = 0.9
max_target = 18.0
step = 1.0
promote_threshold = 0.90
min_episodes = 1024

[sweep]
method = Protein
metric = curriculum_soft_quality
metric_distribution = linear
goal = maximize
downsample = 5
early_stop_min_steps = 40_000_000

[train]
gpus = 1
seed = 42
total_timesteps = 50_000_000
learning_rate = 0.01788370841005079
minibatch_size = 65536
horizon = 128
gamma = 0.9951941456096952
gae_lambda = 0.8950950897628589
ent_coef = 0.1604920157441345
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
clip_coef = 0.41000268739635415
vf_coef = 5.0
vf_clip_coef = 3.484823007218511
max_grad_norm = 3.8432803314849577
anneal_lr = 1
min_lr_ratio = 0
beta1 = 0.9848986194729068
beta2 = 0.998673462312489
eps = 0.000002253309741136361
prio_alpha = 0.5506490443590013
prio_beta0 = 1.0
vtrace_rho_clip = 3.243009815021134
vtrace_c_clip = 2.15402866995608
replay_ratio = 2.8448025380102187

# Dogfight-local sweep centers. Full blocks keep the intent explicit and match
# the tuned-INI format used by other environments.
[sweep.train.total_timesteps]
distribution = log_normal
min = 25_000_000
max = 100_000_000
mean = 50_000_000
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 256
mean = 128
scale = auto

[sweep.policy.num_layers]
